<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrunchTime — Get notified when games get good</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #111; }
    h1 { font-size: 1.8rem; margin-bottom: 4px; }
    p  { color: #555; margin-top: 4px; }
    input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-top: 16px; }
    button { margin-top: 12px; width: 100%; padding: 12px; font-size: 1rem; background: #e85d04; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #333; }
  </style>
</head>
<body>
  <h1>CrunchTime 🏀⚾</h1>
  <p>Get a push notification the moment an NBA or MLB game gets tense.</p>

  <input type="email" id="email" placeholder="your@email.com" />
  <button id="btn" onclick="subscribe()">Enable game alerts</button>
  <div id="status"></div>

  <script>
    const API = "";  // same origin — FastAPI serves both the page and the API

    function setStatus(msg, color = "#333") {
      document.getElementById("status").style.color = color;
      document.getElementById("status").textContent = msg;
    }

    async function urlBase64ToUint8Array(base64String) {
      // Browsers need the VAPID public key as a Uint8Array, not a string.
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribe() {
      const email = document.getElementById("email").value.trim();
      if (!email) { setStatus("Please enter your email.", "red"); return; }

      const btn = document.getElementById("btn");
      btn.disabled = true;
      setStatus("Requesting permission…");

      // 1. Register the service worker
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        setStatus("Your browser doesn't support push notifications.", "red");
        btn.disabled = false;
        return;
      }

      const reg = await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;

      // 2. Get VAPID public key from server
      const keyResp = await fetch(`${API}/vapid-public-key`);
      const { publicKey } = await keyResp.json();
      if (!publicKey) {
        setStatus("Server isn't configured yet (missing VAPID key).", "red");
        btn.disabled = false;
        return;
      }

      // 3. Ask browser for push permission + create subscription
      setStatus("Requesting notification permission…");
      const applicationServerKey = await urlBase64ToUint8Array(publicKey);
      let pushSubscription;
      try {
        pushSubscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey,
        });
      } catch (err) {
        setStatus("Permission denied or subscription failed: " + err.message, "red");
        btn.disabled = false;
        return;
      }

      // 4. Send subscription + email to backend
      setStatus("Saving your subscription…");
      const resp = await fetch(`${API}/users/signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email,
          push_subscription: pushSubscription.toJSON(),
        }),
      });

      if (resp.ok) {
        setStatus("You're in! You'll get a notification when a game gets close.", "green");
      } else {
        const err = await resp.json();
        setStatus("Signup failed: " + JSON.stringify(err), "red");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
